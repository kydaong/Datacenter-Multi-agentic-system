
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: 6333
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mlflow-data:/app/mlruns
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build:
      context: ./mags-ui-vite
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:

volumes:
  mlflow-data:
