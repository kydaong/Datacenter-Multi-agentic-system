
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: 6333
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlruns.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mlflow-data:/app/mlruns
    networks:
      - app-net
    restart: unless-stopped
    mem_limit: 6g

  frontend:
    build:
      context: ./mags-ui-vite
      dockerfile: Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped
    mem_limit: 512m

networks:
  app-net:

volumes:
  mlflow-data:
