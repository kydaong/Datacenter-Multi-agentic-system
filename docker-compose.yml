
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - mlflow-data:/app/mlruns
    depends_on:
      - qdrant
    networks:
      - app-net
    restart: unless-stopped

  frontend:
    build:
      context: ./mags-ui-vite
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:

volumes:
  qdrant-data:
  mlflow-data:
